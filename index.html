<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
    <link rel="apple-touch-icon" href="/images/icon-512.png" />
    <link rel="stylesheet" as="style" crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
    <title>PetCare+</title>
    <style>
      html, body { margin: 0; padding: 0; background: #F4F6F2; min-height: 100%; }
      #root { min-height: 100dvh; min-height: 100vh; display: flex; flex-direction: column; }
      #root > * { flex: 1; }
      .boot-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100dvh;
        min-height: 100vh;
        background: #F4F6F2;
      }
      .boot-loader img { width: 56px; height: 56px; border-radius: 14px; animation: boot-pulse 1.4s ease-in-out infinite; }
      .boot-loader span { font-size: 13px; color: #8B9A93; font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader">
        <img src="/images/logo.svg" alt="" />
        <span>불러오는 중…</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
